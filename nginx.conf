# NGINX Configuration for Blue-Green Deployment
# LegalSuite Core

events {
    worker_connections 1024;
}

http {
    # Upstream definition for Blue Environment (Stable Prod)
    upstream backend_blue {
        server 127.0.0.1:3000; # Assuming Blue runs on port 3000
        # Add more servers here if horizontally scaled
    }

    # Upstream definition for Green Environment (Beta Features)
    upstream backend_green {
        server 127.0.0.1:3001; # Assuming Green runs on port 3001
        # Add more servers here if horizontally scaled
    }

    # Map block to dynamically route traffic based on a cookie or header (Optional advanced routing)
    # Useful if you want specific beta testers to hit the green environment
    map $cookie_beta_tester $active_backend {
        default "backend_blue"; # Default to Blue (Stable)
        "true"  "backend_green"; # Beta testers go to Green
    }

    server {
        listen 80;
        server_name legalsuite.local; # Replace with your actual domain

        # Redirect all HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        # Standard Proxy Configuration
        location / {
            # To perform a hard switch of ALL traffic from Blue to Green, 
            # change proxy_pass from http://backend_blue to http://backend_green
            
            proxy_pass http://backend_blue;
            
            # If using the map block for advanced routing:
            # proxy_pass http://$active_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Security Headers (as per PRD requirements)
            add_header X-Frame-Options "DENY";
            add_header X-Content-Type-Options "nosniff";
            add_header X-XSS-Protection "1; mode=block";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
    }
}
