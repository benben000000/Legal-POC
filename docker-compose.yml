version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: legalsuitecore-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: legaluser
      POSTGRES_PASSWORD: legalpass
      POSTGRES_DB: legalsuitedb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
